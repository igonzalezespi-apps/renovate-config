name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Renovate preset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: JSON parse sanity check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('default.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('renovate.json','utf8'))"

      - name: Install pinned renovate validator
        run: npm install -g renovate@44.17.0

      - name: Validate default.json (strict)
        run: renovate-config-validator --strict default.json

      - name: Validate renovate.json (strict)
        run: renovate-config-validator --strict renovate.json
