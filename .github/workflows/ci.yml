name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Renovate preset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: JSON parse sanity check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('default.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('renovate.json','utf8'))"

      - name: Install pinned renovate validator
        run: npm install -g renovate@44.24.0

      - name: Validate default.json (strict)
        run: renovate-config-validator --strict default.json

      - name: Validate renovate.json (strict)
        run: renovate-config-validator --strict renovate.json
