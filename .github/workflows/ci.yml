name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Concurrency (studio#276): solo se cancela lo que un commit NUEVO deja viejo.
#   - `opened` y `synchronize` comparten un grupo por PR y cancelan la run en curso: la cancelada
#     es la de un commit que ya no es la cabeza.
#   - Los demas eventos de PR (`reopened`, `labeled`, `edited`...) van a un grupo por PR y commit
#     SIN cancelar: nunca matan la run en curso ni la del commit nuevo. Si GitHub descarta una run
#     PENDIENTE del grupo, sale `cancelled` sin jobs y no deja check en la cabeza.
#   - Push, `workflow_dispatch` y `schedule` van a un grupo por run: nadie los cancela, y cada
#     commit de develop/main tiene su CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (contains(fromJSON('["opened","synchronize"]'), github.event.action) && format('pr-{0}', github.event.pull_request.number) || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize"]'), github.event.action) }}

jobs:
  validate:
    name: Validate Renovate preset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The validator comes from package-lock.json, not from `npm install -g renovate@<v>`. That
      # pinned renovate itself but let its ~600 transitive dependencies float on every run, which
      # is why the fleet install-vector sweep flagged it. `npm ci` installs exactly the tree the
      # lockfile names, each package checked against its integrity hash. Install scripts stay ON:
      # without them RE2 is not built and the validator silently falls back to RegExp, accepting a
      # lookbehind that Renovate itself rejects (measured 2026-09-22).
      - name: Install the pinned validator from the lockfile
        run: npm ci --no-audit --no-fund

      # Glob, NOT a list of names. This step used to name default.json and renovate.json
      # one by one, so the day a THIRD preset file was added it would have shipped
      # unvalidated — the gate would still be green while covering less than it claimed.
      # Found exactly that way while adding config-repo.json.
      - name: Validate every preset file (strict)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in *.json; do
            case "$f" in
              package.json|package-lock.json|tsconfig.json) continue ;;
            esac
            files+=("$f")
          done
          # Zero files is a broken invocation, never a pass: it is how a check that stopped
          # looking at anything goes green.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no preset files matched — this is a broken check, not a pass"
            exit 1
          fi
          echo "validando: ${files[*]}"
          for f in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            npx --no-install renovate-config-validator --strict "$f"
          done
