name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Renovate preset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: JSON parse sanity check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('default.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('renovate.json','utf8'))"

      - name: Install pinned renovate validator
        run: npm install -g renovate@43.288.0

      - name: Validate default.json (strict)
        run: renovate-config-validator --strict default.json

      - name: Validate renovate.json (strict)
        run: renovate-config-validator --strict renovate.json
