name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Renovate preset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned renovate validator
        run: npm install -g renovate@44.56.3

      # Glob, NOT a list of names. This step used to name default.json and renovate.json
      # one by one, so the day a THIRD preset file was added it would have shipped
      # unvalidated — the gate would still be green while covering less than it claimed.
      # Found exactly that way while adding config-repo.json.
      - name: Validate every preset file (strict)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in *.json; do
            case "$f" in
              package.json|package-lock.json|tsconfig.json) continue ;;
            esac
            files+=("$f")
          done
          # Zero files is a broken invocation, never a pass: it is how a check that stopped
          # looking at anything goes green.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no preset files matched — this is a broken check, not a pass"
            exit 1
          fi
          echo "validando: ${files[*]}"
          for f in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            renovate-config-validator --strict "$f"
          done
