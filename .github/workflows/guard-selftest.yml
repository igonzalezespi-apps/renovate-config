# Public repo (GitHub-hosted CI) — runs the vendored guard's own self-tests on every PR, so a
# broken or un-cabled guard is caught in CI instead of silently failing open on a contributor's
# machine. Deliberately standalone (separate from the preset-validation CI): the guard is a
# zero-dependency plain-node script, so this only needs Node — no renovate toolchain.
name: Guard self-test

on:
  pull_request:

# PR-only workflow: coalesce superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard-selftest:
    name: guard-selftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node only: the guard extracts the tool-call JSON via `node -e` (no jq, no deps), so a
      # lightweight setup-node reusing the repo's .nvmrc is all the self-tests need.
      - name: PINS — ninguna accion clavada a un alias flotante
        # La sexta comprobacion es la razon de que esta accion exista, y no la tenia ningun
        # verificador de la flota: un pin comentado como `# v7` cuando existe `# v7.0.1`.
        # Renovate trata el primero como cambio de DIGEST, que no lleva `releaseTimestamp`, asi
        # que con `minimumReleaseAgeBehaviour` en su valor por defecto esa actualizacion NO PUEDE
        # satisfacer la reja de edad jamas — y no da rojo: la PR se queda parada en silencio.
        #
        # Va en este workflow y no en uno propio porque es lo mismo que el resto: higiene del
        # repo comprobada DISPARANDO, sobre el checkout que ya esta hecho, sin un runner mas.
        #
        # Su contrato de salida distingue las tres respuestas: 0 sanos, 1 al menos una violacion,
        # y 2 NO SE PUDO MEDIR (sin `gh`, API caida, o cero workflows — un glob roto no es un
        # verde). Los tres hacen lo correcto aqui: solo el 0 deja pasar.
        uses: igonzalezespi-apps/studio-ci/check-action-pins@bab8a68625f3f0299041a07afb273a0b997c2b81 # v0.6.0
        with:
          github-token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: bash-guard self-test (all cases pass, suite never shrinks)
        # The total is NOT hardcoded, and that is the whole point of this step's shape.
        #
        # It used to be `grep -q 'OK: 100/100'`. On 2026-08-14 the canonical guard gained three
        # cases, the suite printed `OK: 103/103 cases pass` — a STRICTLY BETTER result — and this
        # step failed. In four repos at once, because every one of them pinned the same number.
        # An assertion that goes red when the thing it guards improves teaches you to ignore it.
        #
        # What is actually worth catching is the suite SHRINKING (cases deleted, harness truncated)
        # or cases FAILING. So: `pass == total`, plus a floor. Adding cases stays green; removing
        # them, or dropping below the floor, goes red. Raise the floor when it is worth ratcheting.
        run: |
          set -o pipefail
          bash scripts/hooks/bash-guard.test.sh | tee "$RUNNER_TEMP/bash-guard.out"
          res=$(sed -nE 's/^OK: ([0-9]+)\/([0-9]+) cases pass.*/\1 \2/p' "$RUNNER_TEMP/bash-guard.out" | tail -1)
          [ -n "$res" ] || { echo "::error::bash-guard self-test printed no result line at all"; exit 1; }
          pass=${res% *}; total=${res#* }
          [ "$pass" = "$total" ] || { echo "::error::bash-guard self-test: only $pass of $total cases pass"; exit 1; }
          [ "$total" -ge 107 ] || { echo "::error::bash-guard self-test SHRANK to $total cases (floor is 107)"; exit 1; }

      - name: Liveness — push-to-main is denied (exit 2)
        shell: bash
        run: |
          set +e
          printf '%s' '{"tool_name":"Bash","tool_input":{"command":"git push origin main"}}' \
            | BASH_GUARD_BRANCH=feature/1-x bash scripts/hooks/bash-guard.sh
          rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::bash-guard did not deny push-to-main (expected exit 2, got $rc)"
            exit 1
          fi
          echo 'OK: bash-guard denied push-to-main with exit 2'

      # Wiring: a guard that passes its tests but is not cabled into the agent runtime is dead
      # code. Assert the hook config invokes bash-guard as a PreToolUse Bash hook.
      - name: Wiring — settings.json cables bash-guard
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(".claude/settings.json", "utf8"));
            const pre = (s.hooks && s.hooks.PreToolUse) || [];
            const cabled = pre.some((g) =>
              (g.matcher || "").split("|").includes("Bash") &&
              (g.hooks || []).some((h) => typeof h.command === "string" && h.command.includes("bash-guard.sh")));
            if (!cabled) {
              console.error("::error::.claude/settings.json PreToolUse must cable bash-guard.sh as a Bash hook");
              process.exit(1);
            }
            console.log("OK: settings.json cables bash-guard.sh as a PreToolUse Bash hook");
          '
